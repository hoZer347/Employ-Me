# Netlify build & deploy configuration
[build]
  command = "npm run build"
  publish = "dist"

# The Vanguards Unity WebGL build ships its big assets Brotli-precompressed
# (.br). Netlify passes .br through untouched, so we declare the encoding here
# and pin the *decoded* Content-Type; the browser then transparently
# decompresses and Unity's loader receives the bytes it expects. The companion
# bundler in vite.config.ts ships these files as-is (it only decodes .gz). The
# .loader.js is uncompressed and needs no header.
[[headers]]
  for = "/vanguards-build/Build/vanguards.data.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/vanguards-build/Build/vanguards.framework.js.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/javascript"

[[headers]]
  for = "/vanguards-build/Build/vanguards.wasm.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/wasm"

# Gobspin ships Brotli-precompressed too; same handling as Vanguards above. Its
# themed /gobspin/ loader page frames the build served from /gobspin-build.
[[headers]]
  for = "/gobspin-build/Build/gobspin.data.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/gobspin-build/Build/gobspin.framework.js.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/javascript"

[[headers]]
  for = "/gobspin-build/Build/gobspin.wasm.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/wasm"

# Brrreak it Down is the build published on itch.io, mirrored here; Brotli too.
[[headers]]
  for = "/brrreak-it-down-build/Build/brrreak-it-down.data.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/brrreak-it-down-build/Build/brrreak-it-down.framework.js.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/javascript"

[[headers]]
  for = "/brrreak-it-down-build/Build/brrreak-it-down.wasm.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/wasm"

# Loom's web build runs on pthreads, which need SharedArrayBuffer, which the
# browser only hands to a cross-origin isolated page. The engine is framed, and
# isolation only reaches a frame whose parent is isolated too, so every page
# gets the pair. Netlify merges these with the per-path blocks above.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# Text edits the host made in the page are stored here rather than in the
# source modules, so they ship as data and have to revalidate. Netlify runs no
# server, so /__edit/* is answered by nothing and this deploy is read-only: the
# editor is only ever armed against a server on the machine hosting the site.
[[headers]]
  for = "/content-overrides.json"
  [headers.values]
    Cache-Control = "no-cache"

# SPA fallback: serve index.html for any route so client-side
# navigation works on direct loads / refreshes. Not forced, so the real
# /vanguards-build/* and /gobspin-build/* static assets above are served
# directly, not rewritten.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
